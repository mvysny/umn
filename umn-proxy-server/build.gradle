dependencies {
    compile(project(":umn-proxy-client"))
    compile 'org.eclipse.jetty.websocket:websocket-server:9.4.12.v20180830'
    compile("ch.qos.logback:logback-classic:1.2.3")

    // REST Admin API
    compile 'io.javalin:javalin:2.3.0'
    compile 'com.google.code.gson:gson:2.8.5'

    // config file parsing
    compile 'org.yaml:snakeyaml:1.23'

    testCompile 'com.squareup.okhttp3:okhttp:3.11.0'
    testCompile(project(":umn-sync-tester"))
}

task zip(type: Zip) {
    from 'src/main/scripts'
    into('lib') {
        from configurations.runtime.allArtifacts.files
        from configurations.runtime
    }
}

artifacts {
    archives zip
}
