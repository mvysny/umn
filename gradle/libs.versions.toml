[versions]
# https://repo1.maven.org/maven2/org/slf4j/slf4j-api/
slf4j = "2.0.20"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = "org.junit:junit-bom:6.1.3"
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
gson = "com.google.code.gson:gson:2.14.0"

# okhttp 3.13+ and 4.x need Android API 21, under minSdk 22: https://square.github.io/okhttp/#requirements
# It stays 4.x because it is `api` in umn-proxy-client: a new major waits until Aedict is ready for one.
okhttp = "com.squareup.okhttp3:okhttp:4.12.0"
snakeyaml = "org.yaml:snakeyaml:2.7"
javalin = "io.javalin:javalin:7.2.3"
# lift javalin's jetty to the newest 12.1.x patch
jetty-bom = "org.eclipse.jetty:jetty-bom:12.1.14"
jetty-ee10-bom = "org.eclipse.jetty.ee10:jetty-ee10-bom:12.1.14"

# 1.4.198+ requires Android 19 or higher, under minSdk 22: https://gitlab.com/mvysny/umn/issues/6
# Never 2.x, and a 1.4.x bump keeps file format 1 and the ObjectDataType tags: D_frozen_0_15_formats
h2-mvstore = "com.h2database:h2-mvstore:1.4.198"
vok-dataloader = "com.github.mvysny.vokdataloader:vok-dataloader:0.9.1"

testcontainers = "org.testcontainers:testcontainers:2.0.5"
testcontainers-junit-jupiter = "org.testcontainers:testcontainers-junit-jupiter:2.0.5"

# umn-compat-0.15: UMN 0.15 on the classpath Aedict-Online runs it on (aedict-common 3.50.19),
# which pins these over 0.15's pom
umn015-proxy-client = "com.gitlab.mvysny.umn:umn-proxy-client:0.15"
umn015-okhttp = "com.squareup.okhttp3:okhttp:3.12.2"
umn015-kotlin-stdlib = "org.jetbrains.kotlin:kotlin-stdlib:1.4.0"
umn015-vok-dataloader = "com.github.mvysny.vokdataloader:vok-dataloader:0.5"
umn015-slf4j-simple = "org.slf4j:slf4j-simple:1.7.25"
