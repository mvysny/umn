variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - rm -f  .gradle/caches/modules-2/modules-2.lock
  - rm -fr .gradle/caches/*/plugin-resolution/
cache:
  key: "$CI_COMMIT_REF_NAME"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
    - .gradle/build-cache/
design-tripwires:
  image: buildpack-deps:scm
  before_script: []
  cache: []
  script:
    - design/verify_design_tripwires.sh
build:
  image: eclipse-temurin:${JDK}-jdk
  parallel:
    matrix:
      - JDK: ["17", "21", "25"]
  script:
    # the eclipse-temurin image has no git, which the tripwire needs; the design-tripwires job runs it
    - ./gradlew build -x verifyDesignTripwires
    - ./gradlew clean umn-proxy-client:build -x test
