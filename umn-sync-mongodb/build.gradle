dependencies {
    compile(project(":umn-core"))
    compile 'org.mongodb:mongodb-driver-sync:3.8.0'
    testCompile(project(":umn-sync-tester"))
//    compile("ch.qos.logback:logback-classic:1.2.3")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId 'umn-sync-mongodb'
            version project.version
            pom.withXml {
                def root = asNode()
                root.appendNode('description', 'UMN: Sync with MongoDB')
                root.appendNode('name', 'umn-sync-mongodb')
                root.appendNode('url', 'https://gitlab.com/mvysny/umn')
            }
            from components.java
            artifact sourceJar {
                classifier "sources"
            }
        }
    }
}

bintray {
    user = local.getProperty('bintray.user')
    key = local.getProperty('bintray.key')
    pkg {
        repo = 'gitlab'
        name = 'com.gitlab.mvysny.umn'
        licenses = ['MIT']
        vcsUrl = 'https://gitlab.com/mvysny/umn'
        publish = true
        publications = ['mavenJava']
        version {
            name = project.version
            released = new Date()
        }
    }
}

