buildscript {
    ext.dynatest_version = "0.11"

    ext.local = new Properties()
    if (project.rootProject.file('local.properties').exists()) {
        ext.local.load(project.rootProject.file('local.properties').newDataInputStream())
    }
}

plugins {
    id "org.jetbrains.kotlin.jvm" version "1.2.71"
    id "com.jfrog.bintray" version "1.8.1"
}

defaultTasks 'clean', 'build'

allprojects {
    group 'com.gitlab.mvysny.umn'
    version '0.15-SNAPSHOT'
    repositories {
        jcenter()
        maven { url "https://dl.bintray.com/mvysny/github" }
    }
}

sourceCompatibility = 1.6

subprojects {

    apply plugin: 'maven-publish'
    apply plugin: 'kotlin'
    apply plugin: 'com.jfrog.bintray'

    compileKotlin {
        kotlinOptions {
            jvmTarget = "1.6" // because of Android compatibility
            if (System.getProperty("kotlin.jdkHome") != null) {
                jdkHome = System.getProperty("kotlin.jdkHome")
            }
        }
    }
    compileTestKotlin {
        kotlinOptions {
            jvmTarget = "1.6"
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            // to see the exceptions of failed tests in Travis-CI console.
            exceptionFormat 'full'
        }
    }

    task sourceJar(type: Jar, dependsOn: classes) {
        classifier = 'sources'
        from sourceSets.main.allSource
    }
}
