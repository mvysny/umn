dependencies {
    compile "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"  // don't use -jdk8 to stay compatible with Android
    compile 'org.slf4j:slf4j-api:1.7.25'
    compile 'com.h2database:h2-mvstore:1.4.196'
    testCompile("com.github.mvysny.dynatest:dynatest:${dynatest_version}")
    testCompile("ch.qos.logback:logback-classic:1.2.3")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId 'umn-core'
            version project.version
            pom.withXml {
                def root = asNode()
                root.appendNode('description', 'UMN: Core')
                root.appendNode('name', 'umn-core')
                root.appendNode('url', 'https://gitlab.com/mvysny/umn')
            }
            from components.java
            artifact sourceJar {
                classifier "sources"
            }
        }
    }
}

bintray {
    user = local.getProperty('bintray.user')
    key = local.getProperty('bintray.key')
    pkg {
        repo = 'gitlab'
        name = 'com.gitlab.mvysny.umn'
        licenses = ['MIT']
        vcsUrl = 'https://gitlab.com/mvysny/umn'
        publish = true
        publications = ['mavenJava']
        version {
            name = project.version
            released = new Date()
        }
    }
}

