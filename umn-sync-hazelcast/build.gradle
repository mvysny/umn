dependencies {
    compile(project(":umn-core"))
    compile 'com.hazelcast:hazelcast-client:3.10.2'
    testCompile(project(":umn-sync-tester"))
    testCompile("com.github.mvysny.dynatest:dynatest:${dynatest_version}")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId 'umn-sync-hazelcast'
            version project.version
            pom.withXml {
                def root = asNode()
                root.appendNode('description', 'UMN: Sync with Hazelcast')
                root.appendNode('name', 'umn-sync-hazelcast')
                root.appendNode('url', 'https://gitlab.com/mvysny/umn')
            }
            from components.java
            artifact sourceJar {
                classifier "sources"
            }
        }
    }
}

bintray {
    user = local.getProperty('bintray.user')
    key = local.getProperty('bintray.key')
    pkg {
        repo = 'gitlab'
        name = 'com.gitlab.mvysny.umn'
        licenses = ['MIT']
        vcsUrl = 'https://gitlab.com/mvysny/umn'
        publish = true
        publications = ['mavenJava']
        version {
            name = project.version
            released = new Date()
        }
    }
}

