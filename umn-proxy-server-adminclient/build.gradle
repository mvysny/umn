dependencies {
    compile "org.jetbrains.kotlin:kotlin-stdlib"  // don't use -jdk8 to stay compatible with Android
    compile "com.squareup.retrofit2:converter-gson:2.4.0"
    testCompile(project(":umn-proxy-server"))
    testCompile("com.github.mvysny.dynatest:dynatest-engine:${dynatest_version}")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId 'umn-proxy-server-adminclient'
            version project.version
            pom.withXml {
                def root = asNode()
                root.appendNode('description', 'UMN: Proxy Server: the Admin interface client')
                root.appendNode('name', 'umn-proxy-server-adminclient')
                root.appendNode('url', 'https://gitlab.com/mvysny/umn')
            }
            from components.java
            artifact sourceJar {
                classifier "sources"
            }
        }
    }
}

bintray {
    user = local.getProperty('bintray.user')
    key = local.getProperty('bintray.key')
    pkg {
        repo = 'gitlab'
        name = 'com.gitlab.mvysny.umn'
        licenses = ['MIT']
        vcsUrl = 'https://gitlab.com/mvysny/umn'
        publish = true
        publications = ['mavenJava']
        version {
            name = project.version
            released = new Date()
        }
    }
}
